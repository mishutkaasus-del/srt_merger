<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0d0d0d;
    --surface: #141414;
    --border:  #2a2a2a;
    --accent:  #e8ff47;
    --accent2: #ff6b35;
    --text:    #e8e8e0;
    --muted:   #555;
    --success: #4ade80;
    --error:   #f87171;
    --mono:    'JetBrains Mono', monospace;
    --display: 'Unbounded', sans-serif;
  }

  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 20px 48px;
    display: flex;
    align-items: baseline;
    gap: 20px;
  }
  .logo {
    font-family: var(--display);
    font-size: 16px;
    font-weight: 900;
    letter-spacing: -0.03em;
    color: var(--accent);
  }
  .logo span { color: var(--muted); font-weight: 400; }
  .nav-links { margin-left: auto; display: flex; gap: 24px; list-style: none; }
  .nav-links a {
    color: var(--muted); text-decoration: none;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--accent); }

  /* ── Main layout ── */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 48px 48px 80px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  /* ── Section header ── */
  .tool-label {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .tool-num {
    font-family: var(--display);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--accent);
    background: rgba(232,255,71,0.08);
    border: 1px solid rgba(232,255,71,0.2);
    padding: 3px 10px;
    border-radius: 2px;
  }
  .tool-title {
    font-family: var(--display);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.04em;
  }

  /* ── Divider ── */
  .divider {
    margin: 48px 0;
    height: 1px;
    background: var(--border);
    position: relative;
  }

  /* ── Col label ── */
  .col-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 8px;
  }

  /* ── Textarea base ── */
  textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.65;
    padding: 14px;
    border-radius: 6px;
    resize: vertical;
    transition: border-color 0.2s;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }

  /* ── Buttons ── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.04em;
    transition: all 0.15s;
  }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:hover { background: #d4e83a; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); border-color: var(--text); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

  .btn-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin-top: 14px;
  }

  /* ── Status log ── */
  .status {
    margin-top: 12px;
    padding: 12px 16px;
    border-radius: 4px;
    font-size: 12px;
    line-height: 1.7;
    white-space: pre-wrap;
    display: none;
  }
  .status.ok   { background: rgba(74,222,128,0.07); border: 1px solid rgba(74,222,128,0.2);  color: var(--success); }
  .status.err  { background: rgba(248,113,113,0.07); border: 1px solid rgba(248,113,113,0.2); color: var(--error); }
  .status.warn { background: rgba(255,107,53,0.07);  border: 1px solid rgba(255,107,53,0.2);  color: var(--accent2); }

  /* ── Copy flash ── */
  .copy-flash { font-size: 11px; color: var(--success); opacity: 0; transition: opacity 0.3s; }
  .copy-flash.show { opacity: 1; }


  /* ══════════════════════════════
     TOOL 1 — TEXT FORMATTER
  ══════════════════════════════ */

  .formatter-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  #fmt-input  { min-height: 140px; }
  #fmt-output {
    min-height: 140px;
    background: rgba(232,255,71,0.03);
    border-color: rgba(232,255,71,0.12);
    cursor: default;
    resize: none;
    color: var(--accent);
  }


  /* ══════════════════════════════
     TOOL 2 — SRT MERGER
  ══════════════════════════════ */

  /* Layout: [SRT drop 160px] [gap] [textarea flex] [gap] [TXT drop 160px] */
  .merger-row {
    display: grid;
    grid-template-columns: 160px 1fr 160px;
    gap: 16px;
    align-items: stretch;
  }

  /* Drop zone — compact, fixed width */
  .drop-zone {
    border: 1.5px dashed var(--border);
    border-radius: 6px;
    padding: 14px 10px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    min-height: 140px;
  }
  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--accent);
    background: rgba(232,255,71,0.04);
  }
  .drop-zone.has-file {
    border-color: var(--success);
    border-style: solid;
    background: rgba(74,222,128,0.04);
  }
  .drop-zone input[type=file] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }
  .drop-icon { font-size: 20px; line-height: 1; pointer-events: none; }
  .drop-ext {
    font-family: var(--display);
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.08em;
    pointer-events: none;
  }
  .drop-label {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.4;
    pointer-events: none;
  }
  .drop-label strong { color: var(--text); }
  .drop-filename {
    font-size: 10px;
    color: var(--success);
    font-weight: 500;
    pointer-events: none;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 0 4px;
  }

  /* "or" highlight in col-label */
  .or-highlight {
    color: var(--accent);
    font-weight: 700;
  }

  /* Textarea col in merger — resizable */
  .merger-textarea-col {
    display: flex;
    flex-direction: column;
    resize: vertical;
    overflow: hidden;
    min-height: 140px;
  }
  #merger-txt-textarea {
    flex: 1;
    resize: none;
    min-height: 0;
  }

  /* Column headers row — matches grid */
  .merger-headers {
    display: grid;
    grid-template-columns: 160px 1fr 160px;
    gap: 16px;
    margin-bottom: 8px;
  }
  .merger-headers .col-label { margin-bottom: 0; }
</style>
</head>
<body>

<header>
  <div class="logo">text<span>/</span>tools</div>
  <nav>
    <ul class="nav-links">
      <li><a href="#formatter">Formatter</a></li>
      <li><a href="#merger">SRT Merger</a></li>
    </ul>
  </nav>
</header>

<main>

  <!-- ══ 01 FORMATTER ══ -->
  <section id="formatter">
    <div class="tool-label">
      <span class="tool-num">01</span>
      <h2 class="tool-title">Text Formatter</h2>
    </div>

    <div class="formatter-grid">
      <div>
        <p class="col-label">Input</p>
        <textarea id="fmt-input" placeholder="Paste your text here…&#10;&#10;Line breaks will be removed and em dash spacing fixed automatically."></textarea>
      </div>
      <div>
        <p class="col-label">Output</p>
        <textarea id="fmt-output" readonly placeholder="Result will appear here…"></textarea>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" onclick="runFormatter()">▶  Format</button>
      <button class="btn btn-ghost" onclick="copyFormatted()">Copy result</button>
      <span class="copy-flash" id="fmt-copy-flash">Copied!</span>
      <button class="btn btn-ghost" style="margin-left:auto" onclick="clearFormatter()">Clear</button>
    </div>
  </section>

  <div class="divider"></div>

  <!-- ══ 02 SRT MERGER ══ -->
  <section id="merger">
    <div class="tool-label">
      <span class="tool-num">02</span>
      <h2 class="tool-title">SRT Merger</h2>
    </div>

    <!-- column labels -->
    <div class="merger-headers">
      <div class="col-label">SRT file</div>
      <div class="col-label">Text</div>
      <div class="col-label">…<span class="or-highlight">or</span> upload .txt</div>
    </div>

    <!-- main three-col row -->
    <div class="merger-row">

      <!-- SRT drop -->
      <div class="drop-zone" id="srt-drop"
           ondrop="handleDrop(event,'srt')"
           ondragover="handleDragOver(event)"
           ondragleave="handleDragLeave(event)">
        <input type="file" accept=".srt" id="srt-input" onchange="handleFileSelect(this,'srt')">
        <div class="drop-icon">📄</div>
        <div class="drop-ext">.SRT</div>
        <div class="drop-label"><strong>Drop here</strong><br>or click to browse</div>
        <div class="drop-filename" id="srt-filename"></div>
      </div>

      <!-- Text textarea -->
      <div class="merger-textarea-col">
        <textarea id="merger-txt-textarea"
          placeholder="Paste your text here…&#10;&#10;One subtitle per paragraph, blank line between blocks."></textarea>
      </div>

      <!-- TXT drop -->
      <div class="drop-zone" id="merger-txt-drop"
           ondrop="handleDrop(event,'txt')"
           ondragover="handleDragOver(event)"
           ondragleave="handleDragLeave(event)">
        <input type="file" accept=".txt" id="txt-input" onchange="handleFileSelect(this,'txt')">
        <div class="drop-icon">📝</div>
        <div class="drop-ext">.TXT</div>
        <div class="drop-label"><strong>Drop here</strong><br>or click to browse</div>
        <div class="drop-filename" id="txt-filename"></div>
      </div>

    </div><!-- /merger-row -->

    <div class="btn-row">
      <button class="btn btn-primary" id="merge-btn" onclick="runMerger()">▶  Merge &amp; Download</button>
      <button class="btn btn-ghost" onclick="clearMerger()">Clear</button>
    </div>

    <div class="status" id="merger-log"></div>
  </section>

</main>

<script>
// ══ FORMATTER ══════════════════════════════

async function runFormatter() {
  const input = document.getElementById('fmt-input').value;
  if (!input.trim()) return;
  const res = await fetch('/api/format', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ text: input })
  });
  const data = await res.json();
  document.getElementById('fmt-output').value = data.result || data.error || '';
}

function copyFormatted() {
  const val = document.getElementById('fmt-output').value;
  if (!val) return;
  navigator.clipboard.writeText(val).then(() => {
    const el = document.getElementById('fmt-copy-flash');
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 1800);
  });
}

function clearFormatter() {
  document.getElementById('fmt-input').value = '';
  document.getElementById('fmt-output').value = '';
}

document.getElementById('fmt-input').addEventListener('paste', () => {
  setTimeout(runFormatter, 50);
});


// ══ SRT MERGER ═════════════════════════════

let srtFile = null;
let txtFile = null;

function handleDragOver(e) {
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}
function handleDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}
function handleDrop(e, type) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) setFile(file, type);
}
function handleFileSelect(input, type) {
  const file = input.files[0];
  if (file) setFile(file, type);
}
function setFile(file, type) {
  if (type === 'srt') {
    srtFile = file;
    document.getElementById('srt-filename').textContent = file.name;
    document.getElementById('srt-drop').classList.add('has-file');
  } else {
    txtFile = file;
    document.getElementById('txt-filename').textContent = file.name;
    document.getElementById('merger-txt-drop').classList.add('has-file');
    // clear textarea since file takes priority
    document.getElementById('merger-txt-textarea').value = '';
  }
}

async function runMerger() {
  const logEl = document.getElementById('merger-log');
  const btn   = document.getElementById('merge-btn');

  if (!srtFile) {
    showLog(logEl, 'Please provide an SRT file.', 'err'); return;
  }

  const txtText = document.getElementById('merger-txt-textarea').value.trim();

  if (!txtFile && !txtText) {
    showLog(logEl, 'Please enter translation text or upload a .txt file.', 'err'); return;
  }

  btn.disabled = true;
  btn.textContent = '⏳  Processing…';
  logEl.style.display = 'none';

  const fd = new FormData();
  fd.append('srt', srtFile);
  if (txtFile) {
    fd.append('txt', txtFile);
  } else {
    fd.append('txt_text', txtText);
  }

  try {
    const res = await fetch('/api/merge', { method: 'POST', body: fd });

    if (!res.ok) {
      const err = await res.json();
      showLog(logEl, err.error || 'Server error', 'err');
      return;
    }

    const blob = await res.blob();
    const log  = res.headers.get('X-Log') || '';
    const cd   = res.headers.get('Content-Disposition') || '';
    const nameMatch = cd.match(/filename="?([^"]+)"?/);
    const filename  = nameMatch ? nameMatch[1] : 'merged.srt';

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    const hasIssues = log.includes('[MISSING]') || log.includes('[SKIP]') || log.includes('[APPROX]');
    const cls = hasIssues ? 'warn' : 'ok';
    const logFormatted = log
      .split(' | ').join('\n')
      .replace(/\[OK\]/g, '✓')
      .replace(/\[MISSING\]/g, '✗ MISSING')
      .replace(/\[APPROX\]/g, '~ APPROX')
      .replace(/\[SKIP\]/g, '! SKIP');
    showLog(logEl, logFormatted || '✓ Done — no issues found', cls);

  } catch(e) {
    showLog(logEl, 'Network error: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = '▶  Merge & Download';
  }
}

function showLog(el, text, cls) {
  el.textContent = text;
  el.className = 'status ' + cls;
  el.style.display = 'block';
}

function clearMerger() {
  srtFile = null; txtFile = null;
  document.getElementById('srt-filename').textContent = '';
  document.getElementById('txt-filename').textContent = '';
  document.getElementById('srt-drop').classList.remove('has-file');
  document.getElementById('merger-txt-drop').classList.remove('has-file');
  document.getElementById('srt-input').value = '';
  document.getElementById('txt-input').value = '';
  document.getElementById('merger-txt-textarea').value = '';
  document.getElementById('merger-log').style.display = 'none';
}
</script>
</body>
</html>
